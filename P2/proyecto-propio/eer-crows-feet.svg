xt><rect x="1670" y="1210" width="390" height="155" fill="#fffdfa" stroke="#633844" stroke-width="2"/><rect x="1671" y="1211" width="388" height="39" fill="#633844"/><text x="1684" y="1237" font-family="DejaVu Sans, sans-serif" font-size="19" fill="white" font-weight="bold" text-anchor="start">Inventario</text><text x="1684" y="1273" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">PK id_inventario</text><text x="1684" y="1299" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">FK, UQ id_producto</text><text x="1684" y="1325" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">cantidad_disponible</text><text x="1684" y="1351" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">fecha_actualizacion</text><rect x="1130" y="1210" width="360" height="155" fill="#fffdfa" stroke="#633844" stroke-width="2"/><rect x="1136" y="1216" width="348" height="143" fill="none" stroke="#633844" stroke-width="1.5"/><rect x="1131" y="1211" width="358" height="39" fill="#633844"/><text x="1144" y="1237" font-family="DejaVu Sans, sans-serif" font-size="19" fill="white" font-weight="bold" text-anchor="start">MovimientoInventario</text><text x="1144" y="1273" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">PK, FK id_inventario</text><text x="1144" y="1299" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">PK nro_movimiento</text><text x="1144" y="1325" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">fecha, tipo</text><text x="1144" y="1351" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#633844" font-weight="normal" text-anchor="start">cantidad, motivo</text><circle cx="565.0" cy="406.0" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><circle cx="1595.0" cy="406.0" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><text x="825" y="570" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#633844" font-weight="bold" text-anchor="start">d / t: exactamente un subtipo por cuenta</text><text x="825" y="602" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="start">La PK/FK por sí sola no impone la totalidad.</text><text x="825" y="629" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="start">Cliente puede existir sin cuenta.</text><circle cx="565.0" cy="609.0" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><circle cx="576.0698667368162" cy="888.6700486328153" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><text x="515.0" y="872.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="middle">solicita</text><text x="1045.0" y="885.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="middle">contiene</text><circle cx="1513.753480564255" cy="900.0689416962742" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><text x="1580.0" y="878.5" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="middle">incluye</text><text x="1865.0" y="1070.5" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="middle">tiene</text><circle cx="1514.0" cy="1287.5" r="6" fill="#fffdfa" stroke="#633844" stroke-width="1.7"/><text x="1580.0" y="1275.5" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#626b74" font-weight="normal" text-anchor="middle">registra</text><text x="60" y="1300" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#633844" font-weight="bold" text-anchor="start">Entidades débiles por identificación</text><text x="60" y="1335" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#633844" font-weight="normal" text-anchor="start">DetallePedido: (id_pedido, nro_renglon).</text><text x="60" y="1367" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#633844" font-weight="normal" text-anchor="start">MovimientoInventario: (id_inventario, nro_movimiento).</text><text x="60" y="1406" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#633844" font-weight="normal" text-anchor="start">Total del pedido = SUM(cantidad × precio_unitario).</text><text x="60" y="1441" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#626b74" font-weight="normal" text-anchor="start">Los mínimos de padre con hijos se implementan en transacciones.</text><text x="60" y="1507" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#626b74" font-weight="normal" text-anchor="start">Símbolos: círculo = cero · barra = uno · pata de cuervo = muchos. Los identificadores de subtipos son heredados.</text></svg>